name: Level 3 checks

on:
  push:
    branches:
      - level-3/power-features
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in web/*.js; do node --check "$file"; done
          for file in tests/*.test.cjs; do node --check "$file"; done
      - name: Run unit and browser integration tests
        run: npm test
