name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "android-icon/**"
      - "tests/**"
      - "package.json"
      - "capacitor.config.json"
      - "signing/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: nur-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NUR_SIGNING_PASSWORD: ${{ secrets.NUR_SIGNING_PASSWORD }}
      APP_ID: app.nur.intentional
      EXPECTED_CERT_SHA256: ec1880cc651af8fe85dc806d1e89a497b1d22dc7f55ec2c7e5cef133cf1bcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Run experience regression tests
        run: |
          node --test tests/*.test.cjs
          python3 tests/verify-apk-certificate.test.py -v

      - name: Require and verify original signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NUR_SIGNING_PASSWORD" || { echo "::error::Repository secret NUR_SIGNING_PASSWORD is missing."; exit 1; }
          mkdir -p signing/runtime
          base64 -d signing/nur-release.p12.b64 > signing/runtime/nur-release.p12
          keytool -exportcert -storetype PKCS12 -keystore signing/runtime/nur-release.p12 -storepass "$NUR_SIGNING_PASSWORD" -alias nur-release -file signing/runtime/nur-cert.der >/dev/null
          ACTUAL="$(sha256sum signing/runtime/nur-cert.der | cut -d' ' -f1)"
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::The keystore does not match the original NUR signing certificate. Refusing to create an incompatible update."
            exit 1
          fi
          echo "Original NUR signing identity verified."

      - name: Install image tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Apply original high-resolution NUR launcher icon
        shell: bash
        run: |
          set -euo pipefail
          ICON="android-icon/nur-app-icon.png"
          test -s "$ICON"
          identify "$ICON"
          ROOT="android/app/src/main/res"
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"
            DEST="$ROOT/mipmap-$density"
            mkdir -p "$DEST"
            rm -f "$DEST/ic_launcher.webp" "$DEST/ic_launcher_round.webp" "$DEST/ic_launcher.jpg" "$DEST/ic_launcher_round.jpg" "$DEST/ic_launcher.png" "$DEST/ic_launcher_round.png"
            convert "$ICON" -filter Lanczos -resize "${size}x${size}" -strip "$DEST/ic_launcher.png"
            cp "$DEST/ic_launcher.png" "$DEST/ic_launcher_round.png"
          done
          rm -f "$ROOT/mipmap-anydpi-v26/ic_launcher.xml" "$ROOT/mipmap-anydpi-v26/ic_launcher_round.xml"

      - name: Preserve dark native launch background
        shell: bash
        run: |
          set -euo pipefail
          ROOT="android/app/src/main/res"
          mkdir -p "$ROOT/drawable" "$ROOT/values-v31"
          cat > "$ROOT/drawable/nur_launch_background.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#030207" />
          </shape>
          XML
          cat > "$ROOT/drawable/nur_transparent.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="1dp" android:height="1dp" android:viewportWidth="1" android:viewportHeight="1">
              <path android:fillColor="#00000000" android:pathData="M0,0h1v1h-1z" />
          </vector>
          XML
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/src/main/res/values/styles.xml')
          s=p.read_text().replace('@drawable/splash','@drawable/nur_launch_background')
          for name in ('AppTheme','AppTheme.NoActionBar','AppTheme.NoActionBarLaunch'):
              pat=rf'(<style name="{re.escape(name)}"[^>]*>)(.*?)(</style>)'
              m=re.search(pat,s,re.S)
              if not m:
                  continue
              body=m.group(2)
              items={'android:windowBackground':'@drawable/nur_launch_background','android:statusBarColor':'#030207','android:navigationBarColor':'#030207'}
              for key,val in items.items():
                  item_pat=rf'<item name="{re.escape(key)}">.*?</item>'
                  replacement=f'<item name="{key}">{val}</item>'
                  if re.search(item_pat,body,re.S):
                      body=re.sub(item_pat,replacement,body,flags=re.S)
                  else:
                      body+='\n        '+replacement
              s=s[:m.start()]+m.group(1)+body+'\n    '+m.group(3)+s[m.end():]
          p.write_text(s)
          PY
          cat > "$ROOT/values-v31/styles.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">#030207</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/nur_transparent</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
                  <item name="android:windowBackground">@drawable/nur_launch_background</item>
                  <item name="android:statusBarColor">#030207</item>
                  <item name="android:navigationBarColor">#030207</item>
              </style>
          </resources>
          XML

      - name: Set update-compatible Android version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="2.1.${GITHUB_RUN_NUMBER}"
          export VERSION_CODE VERSION_NAME
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('android/app/build.gradle')
          s=p.read_text()
          code,n=re.subn(r'versionCode\s+\d+', 'versionCode '+os.environ['VERSION_CODE'], s)
          if n!=1: raise SystemExit('Expected exactly one Android versionCode')
          code,n=re.subn(r'versionName\s+"[^"]+"', 'versionName "'+os.environ['VERSION_NAME']+'"', code)
          if n!=1: raise SystemExit('Expected exactly one Android versionName')
          p.write_text(code)
          PY
          echo "Building $VERSION_NAME ($VERSION_CODE)"
          echo "NUR_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "NUR_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Align, sign, and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="android/app/build/outputs/apk/release/NUR-v2-aligned.apk"
          SIGNED="android/app/build/outputs/apk/release/NUR-v2.apk"
          test -f "$UNSIGNED"
          "$ZIPALIGN" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign --ks signing/runtime/nur-release.p12 --ks-type PKCS12 --ks-key-alias nur-release --ks-pass env:NUR_SIGNING_PASSWORD --key-pass env:NUR_SIGNING_PASSWORD --out "$SIGNED" "$ALIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"
          python3 scripts/verify_apk_certificate.py "$APKSIGNER" "$SIGNED" "$EXPECTED_CERT_SHA256"
          BADGING="$("$AAPT" dump badging "$SIGNED")"
          echo "$BADGING" | grep -F "name='$APP_ID'" >/dev/null
          echo "$BADGING" | grep -F "versionCode='$NUR_VERSION_CODE'" >/dev/null
          echo "Verified package, version, and original signing certificate."

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NUR-Level2-signed-APK
          path: android/app/build/outputs/apk/release/NUR-v2.apk
          if-no-files-found: error
          retention-days: 30
