name: NUR Level 5 release
on:
  push:
    branches: [level-5/deen-companion]
    paths: [.github/workflows/level5-release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nur-level5-release
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NUR_SIGNING_PASSWORD: ${{ secrets.NUR_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply integration fixes
        run: node scripts/level5-fixes.cjs
      - name: Prepare complete attributed Arabic Quran
        run: node scripts/prepare-quran.cjs
      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in web/*.js tests/*.test.cjs scripts/*.cjs; do node --check "$file"; done
      - name: Run regression tests
        run: npm test
      - name: Commit tested source and public assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NUR Build Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/nur-deen-app.js web/nur-deen-store.js web/vendor/adhan.js web/assets/quran-uthmani.json tests/deen.test.cjs
          git diff --cached --quiet || git commit -m 'Integrate and verify Level 5 Deen companion'
          git push origin HEAD:level-5/deen-companion
      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick
      - name: Build and verify original-key signed APK
        run: bash scripts/release-level5.sh
      - name: Upload signed Level 5 APK
        uses: actions/upload-artifact@v4
        with:
          name: NUR-Level5-signed-APK
          path: android/app/build/outputs/apk/release/NUR-Level5.apk
          if-no-files-found: error
          retention-days: 30
